# The source ConfigMap must have the same name and namespace as the Reflector.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-settings
  namespace: default
data:
  LOG_LEVEL: info
  FEATURE_ENABLED: "true"
---
apiVersion: others.helm.k8s.ir/v1alpha1
kind: Reflector
metadata:
  name: shared-settings
  namespace: default
spec:
  kind: ConfigMap
  reflectTo:
    - dev-*
    - prod-*
