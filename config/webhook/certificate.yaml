apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: helm-operator-webhook-cert
  namespace: helm-operator
  labels:
    app.kubernetes.io/name: helm-operator
spec:
  secretName: helm-operator-webhook-cert
  dnsNames:
    - helm-operator-webhook.helm-operator.svc
    - helm-operator-webhook.helm-operator.svc.cluster.local
  issuerRef:
    apiGroup: cert-manager.io
    kind: Issuer
    name: helm-operator-selfsigned
