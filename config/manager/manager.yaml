apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-operator
  namespace: helm-operator
  labels:
    app.kubernetes.io/name: helm-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helm-operator
    spec:
      serviceAccountName: helm-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/devazizi/helm-operator:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: webhook-cert
          secret:
            secretName: helm-operator-webhook-cert
