apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: reflectors.others.helm.k8s.ir
spec:
  group: others.helm.k8s.ir
  scope: Namespaced
  names:
    plural: reflectors
    singular: reflector
    kind: Reflector
    shortNames:
      - reflect
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - kind
                - reflectTo
              properties:
                kind:
                  type: string
                  enum:
                    - Secret
                    - ConfigMap
                  description: Resource kind to reflect from this Reflector's name and namespace.
                reflectTo:
                  type: array
                  minItems: 1
                  description: Shell-style namespace patterns such as dev-* or prod-*.
                  items:
                    type: string
                    minLength: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                reflectedNamespaceCount:
                  type: integer
                  format: int32
                reflectedNamespaces:
                  type: array
                  items:
                    type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Reflected
          type: integer
          jsonPath: .status.reflectedNamespaceCount
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
