apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm-operator.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-operator.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "helm-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 9443
      targetPort: webhook
      protocol: TCP
