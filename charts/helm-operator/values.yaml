replicaCount: 2

image:
  repository: ghcr.io/devazizi/helm-operator
  pullPolicy: IfNotPresent
  # Defaults to Chart.appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: true

webhook:
  # Identity admission always fails closed; this timeout bounds API write delay.
  timeoutSeconds: 10
  # cert-manager must already be installed when this is enabled.
  certManager:
    enabled: true
    createIssuer: true
    issuerRef:
      name: ""
      kind: Issuer
  # Used only when certManager.enabled is false.
  existingSecret: ""
  caBundle: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 10
revisionHistoryLimit: 3
strategy: {}

extraEnv: []
extraVolumeMounts: []
extraVolumes: []

tmpVolume:
  emptyDir: {}
