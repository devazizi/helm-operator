replicaCount: 1

image:
  repository: ghcr.io/devazizi/helm-operator
  pullPolicy: IfNotPresent
  # Defaults to Chart.appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: true

# Standard proxy variables used by Helm's HTTP clients. existingSecret may
# contain HTTP_PROXY, HTTPS_PROXY, NO_PROXY and/or their lowercase equivalents.
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""
  existingSecret: ""

# Downloaded chart archives are retained as .tgz files. StatefulSet-generated
# claims are not removed automatically when the Helm release is uninstalled.
persistence:
  enabled: true
  existingClaim: ""
  mountPath: /var/cache/helm
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  storageClass: ""
  annotations: {}
  selector: {}

webhook:
  # Identity admission always fails closed; this timeout bounds API write delay.
  timeoutSeconds: 10
  # cert-manager must already be installed when this is enabled.
  certManager:
    enabled: true
    createIssuer: true
    issuerRef:
      name: ""
      kind: Issuer
  # Used only when certManager.enabled is false.
  existingSecret: ""
  caBundle: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 10
revisionHistoryLimit: 3
updateStrategy:
  type: RollingUpdate

extraEnv: []
extraVolumeMounts: []
extraVolumes: []

tmpVolume:
  emptyDir: {}
